# Prefix.
set -g prefix C-a
unbind C-b
bind C-a send-prefix

bind r source-file ~/.tmux.conf \; display-message "Reloaded ~/.tmux.conf"

# Terminal.
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB,screen-256color:RGB,tmux-256color:RGB"

# Session behavior.
set -g mouse on
set -g escape-time 10
set -g focus-events on
set -g renumber-windows on
set -g history-limit 100000
set -g detach-on-destroy off
set -g set-clipboard on

# Indexes.
set -g base-index 1
setw -g pane-base-index 1

# Windows and panes.
bind c new-window -c "#{pane_current_path}"
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind Space select-pane -t :.+
bind Tab next-window
bind BTab previous-window

bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5
bind -r C-Space next-layout

# Copy mode.
setw -g mode-keys vi
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy 2>/dev/null || wl-copy 2>/dev/null || xclip -in -selection clipboard 2>/dev/null || xsel -ib 2>/dev/null || cat >/dev/null"
bind -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "pbcopy 2>/dev/null || wl-copy 2>/dev/null || xclip -in -selection clipboard 2>/dev/null || xsel -ib 2>/dev/null || cat >/dev/null"
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "pbcopy 2>/dev/null || wl-copy 2>/dev/null || xclip -in -selection clipboard 2>/dev/null || xsel -ib 2>/dev/null || cat >/dev/null"

# Status line.
set -g status-interval 10
set -g status-justify centre
set -g status-style bg=colour235,fg=colour250
set -g status-left-length 40
set -g status-left '#[fg=green]#H #[fg=colour244]| #[fg=cyan]#S'
set -g status-right-length 80
set -g status-right '#[fg=yellow]%Y-%m-%d #[fg=green]%H:%M #[fg=colour244]| #[fg=blue]#I:#P'
setw -g window-status-style bg=colour235,fg=colour250
setw -g window-status-current-style bg=colour236,fg=brightred,bold
set -g pane-border-style fg=colour235
set -g pane-active-border-style fg=colour240
set -g message-style bg=black,fg=brightred

# Optional TPM setup. Install TPM, then uncomment this block if wanted.
# set -g @plugin 'tmux-plugins/tpm'
# set -g @plugin 'tmux-plugins/tmux-sensible'
# set -g @plugin 'tmux-plugins/tmux-yank'
# run '~/.tmux/plugins/tpm/tpm'

# Local overrides.
if-shell 'test -r ~/.tmux.conf.local' 'source-file ~/.tmux.conf.local'
